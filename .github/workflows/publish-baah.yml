name: Publish baah

on:
  push:
    tags: ["baah-v*"]

permissions:
  contents: read

concurrency:
  group: publish-baah
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Only stable releases are supported');
          assert.equal(process.env.GITHUB_REF_NAME, `baah-v${pkg.version}`, 'Tag must match package version');
          assert.equal(lock.version, pkg.version, 'Lockfile version must match');
          assert.equal(lock.packages[''].version, pkg.version, 'Lockfile root version must match');
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm publish --access public --tag latest
